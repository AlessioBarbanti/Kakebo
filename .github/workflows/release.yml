# Builds the signed app and publishes it (CONTRIBUTING.md "Rilascio"):
# - a push to main, i.e. merging develop, publishes the version in pubspec.yaml when it has no release yet: tag v1.3.0
#   on that commit and a GitHub release whose notes are the version's section of CHANGELOG.md, both written on develop
#   before the merge. A push that leaves the version as it was (a README fix, say) publishes nothing;
# - run by hand on develop (Actions > Release > Run workflow, or gh workflow run release.yml --ref develop) it publishes
#   a pre-release of the coming version: v1.3.0-pre.1, -pre.2 and so on, kept apart from the latest release;
# - run by hand on any other branch it only builds, and the files wait in the run's artifacts.
# A release carries one APK per processor to install (arm64 for almost every phone, armv7 for old ones) and the app
# bundle for Google Play, which carries them all and gives each phone its own.
#
# Signing uses the Play upload key from the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_PASSWORD. They reach only the steps that need them and are never printed; the job runs only on pushes to
# main and by hand, never for pull requests, so forks cannot reach them. The key's alias is not a secret (as one, GitHub
# would mask the word everywhere in the logs).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  # What this run publishes, decided in seconds, before Flutter is installed.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          released() { git ls-remote --exit-code --refs --tags origin "refs/tags/$1" > /dev/null; }
          case "$GITHUB_EVENT_NAME $GITHUB_REF_NAME" in
            "push main")
              if released "v$version"; then
                echo "::notice::v$version is already released, so there is nothing to publish. A release needs a higher version in pubspec.yaml."
                exit 0
              fi
              tag="v$version" ;;
            "workflow_dispatch develop")
              if released "v$version"; then
                echo "::error::v$version is already released: raise the version in pubspec.yaml to the coming one first"
                exit 1
              fi
              tag="v$version-pre.$(( $(git ls-remote --refs --tags origin "refs/tags/v$version-pre.*" | wc -l) + 1 ))" ;;
            *) tag= ;;
          esac
          echo "Publishing: ${tag:-nothing, only building}"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # creating the release and its tag
    env:
      FLUTTER_VERSION: 3.47.5 # the version the app is developed with
      TAG: ${{ needs.plan.outputs.tag }} # empty when only building
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # The release notes are the version's section of CHANGELOG.md, up to the next version or the link list at the end.
      # A pre-release says it is one, and may come before the section is written.
      - name: Release notes from CHANGELOG.md
        if: env.TAG != ''
        run: |
          version=${TAG#v}
          version=${version%-pre.*}
          awk -v v="$version" '/^## \[/ { on = index($0, "[" v "]") > 0; next } /^\[[^]]+\]: / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/section.md"
          if [[ $TAG == *-pre.* ]]; then
            printf 'Versione di prova della %s, dal branch develop: può ancora cambiare prima della release.\n\n' "$version" > "$RUNNER_TEMP/notes.md"
          elif ! grep -q '[^[:space:]]' "$RUNNER_TEMP/section.md"; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat "$RUNNER_TEMP/section.md" >> "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'

          ### Quale file scaricare

          - **`-arm64.apk`**: per quasi tutti i telefoni Android usciti dal 2017 in poi. Se non sai quale scegliere, parti da questo.
          - **`-armv7.apk`**: per i telefoni più vecchi o molto economici. Se hai scelto il file sbagliato non succede niente: Android dice che l'app non è compatibile, e basta scaricare l'altro.
          - **`-play.aab`**: non si installa sul telefono, è il file per la pubblicazione su Google Play.
          NOTES
          cat "$RUNNER_TEMP/notes.md"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build APKs and app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # One APK per processor instead of a universal one (about 20 MB instead of 55). x86_64 only runs emulators and
        # Chromebooks: those get it from the bundle. Split APKs number their versions 1000 (armv7) or 2000 (arm64) higher.
        # A pre-release shows its own name in Android's settings (1.3.0-pre.1); its version number is the release's.
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 ${TAG:+--build-name=${TAG#v}}
          flutter build appbundle --release ${TAG:+--build-name=${TAG#v}}

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Without the secrets Gradle would fall back to the debug key: never ship that. The APK carries only v2+ signatures
      # (minSdk 24), which keytool cannot read, so apksigner checks it; the bundle is JAR-signed.
      - name: Signed with the Play key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in arm64-v8a armeabi-v7a; do
            "$apksigner" verify --print-certs "build/app/outputs/flutter-apk/app-$apk-release.apk" | grep "certificate DN" | tee -a "$RUNNER_TEMP/signers.txt"
          done
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep "^Owner:" | tee -a "$RUNNER_TEMP/signers.txt"
          if [ "$(wc -l < "$RUNNER_TEMP/signers.txt")" -lt 3 ]; then
            echo "::error::Could not read the signatures"
            exit 1
          fi
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/signers.txt"; then
            echo "::error::Signed with the debug key"
            exit 1
          fi

      # Named after the tag, or after the branch when only building (feature/x becomes feature-x).
      - name: Name the files
        run: |
          name=${TAG:-${GITHUB_REF_NAME//\//-}}
          echo "NAME=$name" >> "$GITHUB_ENV"
          mkdir dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/kakebo-$name-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/kakebo-$name-armv7.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/kakebo-$name-play.aab"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kakebo-${{ env.NAME }}
          path: dist/
          if-no-files-found: error

      # Creates the tag on the commit built; a pre-release never becomes the latest release.
      - name: GitHub release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          if [[ $TAG == *-pre.* ]]; then pre=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kakebo $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}"
