# Builds the signed app. A tag like v1.0.0 (it must match the version in pubspec.yaml) also publishes a GitHub release
# with one APK per processor to install (arm64 for almost every phone, armv7 for old ones) and the app bundle for Google
# Play, which carries them all and gives each phone its own. Run by hand (Actions > Release > Run workflow) it only
# builds, and the files wait in the run's artifacts.
#
# Signing uses the Play upload key from the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_PASSWORD. They reach only the steps that need them and are never printed; the job runs only on tags and by
# hand, never for pull requests, so forks cannot reach them. The key's alias is not a secret (as one, GitHub would mask
# the word everywhere in the logs).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # creating the release
    env:
      FLUTTER_VERSION: 3.47.5 # the version the app is developed with
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pubspec.yaml"
            exit 1
          fi

      # The release notes are the version's section of CHANGELOG.md, up to the next version or the link list at the end.
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { on = index($0, "[" v "]") > 0; next } /^\[[^]]+\]: / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'

          ### Quale file scaricare

          - **`-arm64.apk`**: per quasi tutti i telefoni Android usciti dal 2017 in poi. Se non sai quale scegliere, parti da questo.
          - **`-armv7.apk`**: per i telefoni più vecchi o molto economici. Se hai scelto il file sbagliato non succede niente: Android dice che l'app non è compatibile, e basta scaricare l'altro.
          - **`-play.aab`**: non si installa sul telefono, è il file per la pubblicazione su Google Play.
          NOTES
          cat "$RUNNER_TEMP/notes.md"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build APKs and app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # One APK per processor instead of a universal one (about 20 MB instead of 55). x86_64 only runs emulators and
        # Chromebooks: those get it from the bundle. Split APKs number their versions 1000 (armv7) or 2000 (arm64) higher.
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          flutter build appbundle --release

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Without the secrets Gradle would fall back to the debug key: never ship that. The APK carries only v2+ signatures
      # (minSdk 24), which keytool cannot read, so apksigner checks it; the bundle is JAR-signed.
      - name: Signed with the Play key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in arm64-v8a armeabi-v7a; do
            "$apksigner" verify --print-certs "build/app/outputs/flutter-apk/app-$apk-release.apk" | grep "certificate DN" | tee -a "$RUNNER_TEMP/signers.txt"
          done
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep "^Owner:" | tee -a "$RUNNER_TEMP/signers.txt"
          if [ "$(wc -l < "$RUNNER_TEMP/signers.txt")" -lt 3 ]; then
            echo "::error::Could not read the signatures"
            exit 1
          fi
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/signers.txt"; then
            echo "::error::Signed with the debug key"
            exit 1
          fi

      - name: Name the files
        run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/kakebo-$GITHUB_REF_NAME-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/kakebo-$GITHUB_REF_NAME-armv7.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/kakebo-$GITHUB_REF_NAME-play.aab"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kakebo-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Kakebo $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
