name: kakebo
description: "Kakebo, il registro di casa giapponese"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.10.1

flutter:
  generate: true # lib/l10n/generated/app_localizations.dart from the ARB files

  uses-material-design: true
  assets:
    - assets/art/
    - assets/sounds/
    - assets/fonts/OFL-ShipporiMincho.txt
    - assets/fonts/OFL-ZenKakuGothicNew.txt

  # Subsets with only the characters the app uses (python tool/fonts.py), so they load instantly and offline.
  fonts:
    - family: Shippori Mincho
      fonts:
        - asset: assets/fonts/ShipporiMincho-Medium.ttf
          weight: 500
        - asset: assets/fonts/ShipporiMincho-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ShipporiMincho-Bold.ttf
          weight: 700
    - family: Zen Kaku Gothic New
      fonts:
        - asset: assets/fonts/ZenKakuGothicNew-Regular.ttf
        - asset: assets/fonts/ZenKakuGothicNew-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZenKakuGothicNew-Bold.ttf
          weight: 700

# dart run tool/icon.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#2d5742" # Kakebo green: the ensō is painted in negative (tool/icon.dart)
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_foreground_inset: 0 # tool/icon.dart already sizes the art for the 108 dp layer; the default 16 shrank it twice
  adaptive_icon_monochrome: assets/icon/monochrome.png
  min_sdk_android: 21
